<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Hostel Details — GCTU Hostel Finder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<div class="app-shell" style="padding-bottom: 24px;">
  <div class="detail-hero" id="detailHero">
    <a href="index.html" class="back-btn" aria-label="Back">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="m15 18-6-6 6-6"/></svg>
    </a>
  </div>

  <div class="detail-body" id="detailBody">
    <div class="skeleton" style="height:20px; width:70%; margin-bottom:10px;"></div>
    <div class="skeleton" style="height:14px; width:50%; margin-bottom:20px;"></div>
    <div class="skeleton" style="height:100px; width:100%;"></div>
  </div>
</div>

<!-- Booking confirmation sheet -->
<div class="modal-overlay" id="bookingModal">
  <div class="modal-sheet">
    <h3>Confirm booking</h3>
    <div class="form-group">
      <label>Room type</label>
      <input type="text" id="modalRoomType" disabled />
    </div>
    <div class="form-group">
      <label>Academic year</label>
      <select id="academicYear">
        <option value="2026/2027">2026/2027</option>
        <option value="2027/2028">2027/2028</option>
      </select>
    </div>
    <div class="form-group">
      <label>Semester</label>
      <select id="semester">
        <option value="full_year">Full Academic Year</option>
        <option value="first">First Semester</option>
        <option value="second">Second Semester</option>
      </select>
    </div>
    <button class="btn btn-primary btn-block" id="confirmBookingBtn">Confirm Booking</button>
    <button class="btn btn-ghost btn-block" id="cancelBookingBtn" style="margin-top:8px;">Cancel</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/ui.js"></script>
<script src="js/hostel.js"></script>
</body>
</html>
