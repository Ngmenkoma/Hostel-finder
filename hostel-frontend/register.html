<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sign Up — GCTU Hostel Finder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<div class="auth-shell">
  <div class="auth-hero">
    <div class="eyebrow">Get started</div>
    <h1>Create your<br/>account</h1>
  </div>

  <div class="auth-body">
    <div class="role-toggle" id="roleToggle">
      <button type="button" class="active" data-role="student">I'm a Student</button>
      <button type="button" data-role="landlord">I'm a Landlord</button>
    </div>

    <form id="registerForm">
      <div class="form-group">
        <label for="fullName">Full name</label>
        <input type="text" id="fullName" required placeholder="e.g. Yilob Kelvin Ngmenkoma" />
      </div>
      <div class="form-group">
        <label for="email">Email address</label>
        <input type="email" id="email" required placeholder="you@example.com" />
      </div>
      <div class="form-group">
        <label for="phone">Phone number</label>
        <input type="tel" id="phone" placeholder="024 000 0000" />
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" required minlength="6" placeholder="At least 6 characters" />
      </div>
      <button type="submit" class="btn btn-primary btn-block" id="registerBtn">Create Account</button>
    </form>
    <p class="auth-footer-link">Already have an account? <a href="login.html">Log in</a></p>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/ui.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
