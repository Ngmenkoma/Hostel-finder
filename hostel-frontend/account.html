<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Account — GCTU Hostel Finder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<div class="app-shell">
  <header class="app-header" style="padding-bottom:18px;">
    <div class="brand" style="margin-bottom:0;">
      <h1>My <span>Account</span></h1>
      <a href="index.html" class="icon-btn" aria-label="Back">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m15 18-6-6 6-6"/></svg>
      </a>
    </div>
  </header>

  <main class="page-content" id="accountContent"></main>

  <nav class="bottom-nav">
    <a href="index.html" class="nav-item">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m3 12 9-9 9 9"/><path d="M5 10v10h14V10"/></svg>
      Home
    </a>
    <a href="bookings.html" class="nav-item">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
      Bookings
    </a>
    <a href="dashboard.html" class="nav-item">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3v18h18"/><path d="M7 14l4-4 3 3 5-6"/></svg>
      Manage
    </a>
    <a href="account.html" class="nav-item active">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4.4 3.6-8 8-8s8 3.6 8 8"/></svg>
      Profile
    </a>
  </nav>
</div>

<div class="toast" id="toast"></div>

<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/ui.js"></script>
<script>
  const u = getUser();
  const content = document.getElementById("accountContent");

  if (!u) {
    window.location.href = "login.html";
  } else {
    content.innerHTML = `
      <div class="list-item" style="padding:20px;">
        <div style="font-size:17px; font-weight:700; margin-bottom:4px;">${u.fullName}</div>
        <div style="font-size:13px; color:var(--slate); margin-bottom:2px;">${u.email}</div>
        <span class="amenity-tag" style="margin-top:8px; display:inline-block; text-transform:capitalize;">${u.role}</span>
      </div>
      <button class="btn btn-danger btn-block" id="logoutBtn" style="margin-top:16px;">Log Out</button>
    `;
    document.getElementById("logoutBtn").addEventListener("click", () => {
      clearSession();
      window.location.href = "index.html";
    });
  }
</script>
</body>
</html>
