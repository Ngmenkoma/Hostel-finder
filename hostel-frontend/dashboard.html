<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Dashboard — GCTU Hostel Finder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<div class="app-shell">
  <header class="app-header" style="padding-bottom:18px;">
    <div class="brand" style="margin-bottom:0;">
      <h1>Landlord <span>Dashboard</span></h1>
      <a href="index.html" class="icon-btn" aria-label="Back">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m15 18-6-6 6-6"/></svg>
      </a>
    </div>
  </header>

  <main class="page-content" id="dashboardContent">
    <!-- gated content injected by dashboard.js -->
    <div class="skeleton" style="height:80px; margin-bottom:16px;"></div>
    <div class="skeleton" style="height:200px;"></div>
  </main>

  <nav class="bottom-nav">
    <a href="index.html" class="nav-item">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m3 12 9-9 9 9"/><path d="M5 10v10h14V10"/></svg>
      Home
    </a>
    <a href="bookings.html" class="nav-item">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
      Bookings
    </a>
    <a href="dashboard.html" class="nav-item active">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3v18h18"/><path d="M7 14l4-4 3 3 5-6"/></svg>
      Manage
    </a>
    <a href="account.html" class="nav-item">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4.4 3.6-8 8-8s8 3.6 8 8"/></svg>
      Profile
    </a>
  </nav>
</div>

<!-- Add hostel sheet -->
<div class="modal-overlay" id="addHostelModal">
  <div class="modal-sheet">
    <h3>Add a hostel listing</h3>
    <form id="addHostelForm">
      <div class="form-group">
        <label>Hostel name</label>
        <input type="text" id="hostelName" required placeholder="e.g. Sunrise Hostel" />
      </div>
      <div class="form-group">
        <label>Location</label>
        <input type="text" id="hostelLocation" required placeholder="e.g. Tesano, near GCTU" />
      </div>
      <div class="form-group">
        <label>Distance from campus (km)</label>
        <input type="number" step="0.1" id="hostelDistance" placeholder="e.g. 0.8" />
      </div>
      <div class="form-group">
        <label>Amenities (comma-separated)</label>
        <input type="text" id="hostelAmenities" placeholder="WiFi, Water, Security" />
      </div>
      <div class="form-group">
        <label>Description</label>
        <textarea id="hostelDescription" placeholder="Brief description of the hostel"></textarea>
      </div>
      <button type="submit" class="btn btn-primary btn-block" id="saveHostelBtn">Save Hostel</button>
      <button type="button" class="btn btn-ghost btn-block" id="closeHostelModal" style="margin-top:8px;">Cancel</button>
    </form>
  </div>
</div>

<!-- Add room sheet -->
<div class="modal-overlay" id="addRoomModal">
  <div class="modal-sheet">
    <h3>Add a room type</h3>
    <form id="addRoomForm">
      <div class="form-group">
        <label>Hostel</label>
        <select id="roomHostelId" required></select>
      </div>
      <div class="form-group">
        <label>Room type</label>
        <select id="roomType">
          <option value="single">Single Room</option>
          <option value="shared_2">Shared (2 in a room)</option>
          <option value="shared_4">Shared (4 in a room)</option>
          <option value="shared_6">Shared (6 in a room)</option>
        </select>
      </div>
      <div class="form-group">
        <label>Price per semester (GH₵)</label>
        <input type="number" id="roomPrice" required placeholder="e.g. 1500" />
      </div>
      <div class="form-group">
        <label>Total slots</label>
        <input type="number" id="roomSlots" required placeholder="e.g. 10" />
      </div>
      <button type="submit" class="btn btn-primary btn-block" id="saveRoomBtn">Save Room</button>
      <button type="button" class="btn btn-ghost btn-block" id="closeRoomModal" style="margin-top:8px;">Cancel</button>
    </form>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/ui.js"></script>
<script src="js/dashboard.js"></script>
</body>
</html>
